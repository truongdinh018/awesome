name: Weekly trending repos

on:
  schedule:
    # Backup — ưu tiên Cursor Automation (xem data/trending/CURSOR-AUTOMATION.md)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Fetch trending AI repos
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:trending

      - name: Commit trending data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending/ site/public/data/trending-week.json
          if git diff --staged --quiet; then
            echo "No trending changes to commit"
          else
            git commit -m "chore(trending): cập nhật repo trending tuần $(date -u +%G-W%V)"
            git push
          fi
